<!--
  app-icon.svg: the Ganttora icon: a "G" whose bar is a task that ends in a
  milestone. Drawn for this project.

  This is the source image. All other files in this folder are generated
  from it with:   pnpm tauri icon backend/src-tauri/icons/app-icon.svg -o backend/src-tauri/icons
  (delete the "android" and "ios" folders it makes: Ganttora is a desktop app).
  Also shown in the top row (frontend/shell/AppShell.tsx).
-->
