  <rect x="32" y="32" width="448" height="448" rx="104" fill="#1e1b4b"/>
  <path d="M367 150A150 150 0 1 0 396 310" fill="none" stroke="#818cf8" stroke-width="54" stroke-linecap="round"/>
  <rect x="236" y="232" width="112" height="50" rx="14" fill="#22d3ee"/>
  <path d="M398 209l48 48-48 48-48-48z" fill="#f59e0b"/>
</svg>
