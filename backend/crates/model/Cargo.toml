# Crate "model": domain types (tasks, links, calendars, durations, journal records). Data only, no scheduling logic.
# See the project documentation and the reference pages in the project documentation
[package]
name = "model"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
uuid = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
# serde_json: the old and new values of a journal ChangeRecord are JSON values,
# so one record type can hold a name (text), a duration (number) or a date.
serde_json = { workspace = true }
